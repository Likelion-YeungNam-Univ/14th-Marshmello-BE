name: CI

on:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run tests
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean test --no-daemon --no-build-cache --rerun-tasks --console=plain

  build-image:
    name: Build image and deployment test
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Build linux/amd64 image
        env:
          BUILD_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$BUILD_ID" =~ ^[0-9a-f]{40}$ ]]
          readonly IMAGE_TAG="marshmello-was-ci:${BUILD_ID}"

          docker build \
            --platform linux/amd64 \
            --build-arg "BUILD_ID=${BUILD_ID}" \
            --tag "$IMAGE_TAG" \
            .

          [[ "$(docker image inspect --format '{{.Architecture}}' "$IMAGE_TAG")" == "amd64" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "BUILD_ID"}}' "$IMAGE_TAG")" == "$BUILD_ID" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE_TAG")" == "$BUILD_ID" ]]

      - name: Run Compose deployment test
        env:
          BUILD_ID: ${{ github.sha }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          readonly PROJECT_NAME="marshmello-was-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          readonly SECRET_DIR="$(mktemp -d "${RUNNER_TEMP}/marshmello-ci.XXXXXX")"
          export APP_IMAGE="marshmello-was-ci:${BUILD_ID}"
          export APP_PORT=18080
          export APP_UID="$(id -u)"
          export APP_GID="$(id -g)"
          export POSTGRES_DB=marshmello_ci
          export POSTGRES_USER=marshmello_ci
          export POSTGRES_PASSWORD_FILE="${SECRET_DIR}/postgres_password"

          cleanup() {
            readonly exit_code="$?"
            trap - EXIT
            if (( exit_code != 0 )); then
              docker compose -p "$PROJECT_NAME" -f compose.yaml ps || true
              docker compose -p "$PROJECT_NAME" -f compose.yaml logs --no-color || true
            fi
            docker compose -p "$PROJECT_NAME" -f compose.yaml down -v --remove-orphans || true
            docker image rm "$APP_IMAGE" >/dev/null 2>&1 || true
            rm -rf -- "$SECRET_DIR"
            exit "$exit_code"
          }
          trap cleanup EXIT INT TERM

          openssl rand -hex 32 > "$POSTGRES_PASSWORD_FILE"
          chmod 600 "$POSTGRES_PASSWORD_FILE"

          docker compose -p "$PROJECT_NAME" -f compose.yaml up -d --wait --no-build

          readonly APP_CONTAINER_ID="$(
            docker compose -p "$PROJECT_NAME" -f compose.yaml ps -q app
          )"
          [[ "$APP_CONTAINER_ID" =~ ^[0-9a-f]{64}$ ]]

          readonly DEFAULT_TMPFS_OPTIONS="$(
            docker inspect --format '{{ index .HostConfig.Tmpfs "/tmp" }}' "$APP_CONTAINER_ID"
          )"
          [[ ",$DEFAULT_TMPFS_OPTIONS," == *,noexec,* ]]
          [[ ",$DEFAULT_TMPFS_OPTIONS," == *,nosuid,* ]]
          [[ ",$DEFAULT_TMPFS_OPTIONS," == *,nodev,* ]]

          readonly ONNX_TMPFS_OPTIONS="$(
            docker inspect --format '{{ index .HostConfig.Tmpfs "/opt/onnx-tmp" }}' "$APP_CONTAINER_ID"
          )"
          [[ ",$ONNX_TMPFS_OPTIONS," == *,exec,* ]]
          [[ ",$ONNX_TMPFS_OPTIONS," == *,nosuid,* ]]
          [[ ",$ONNX_TMPFS_OPTIONS," == *,nodev,* ]]
          [[ ",$ONNX_TMPFS_OPTIONS," == *,uid=${APP_UID},* ]]
          [[ ",$ONNX_TMPFS_OPTIONS," == *,gid=${APP_GID},* ]]

          readonly JVM_TMPDIR="$(
            docker compose -p "$PROJECT_NAME" -f compose.yaml exec -T app \
              java -XshowSettings:properties -version 2>&1 \
              | awk -F'= ' '$1 ~ /java.io.tmpdir/ {print $2}'
          )"
          [[ "$JVM_TMPDIR" == "/opt/onnx-tmp" ]]

          docker compose -p "$PROJECT_NAME" -f compose.yaml exec -T app sh -s <<'ONNX_EXEC_PROBE'
          set -eu
          probe=/opt/onnx-tmp/.exec-probe
          trap 'rm -f "$probe"' EXIT
          printf '#!/bin/sh\nexit 0\n' > "$probe"
          chmod 700 "$probe"
          "$probe"
          ONNX_EXEC_PROBE

          readonly HTTP_CODE="$(
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --max-time 10 "http://127.0.0.1:${APP_PORT}/actuator/health"
          )"
          [[ "$HTTP_CODE" == "200" ]]

          readonly DATABASE_RESULT="$(
            docker compose -p "$PROJECT_NAME" -f compose.yaml exec -T postgres \
              sh -ec 'PGPASSWORD="$(cat /run/secrets/postgres_password)" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT 1"'
          )"
          [[ "$DATABASE_RESULT" == "1" ]]

  deploy:
    name: Deploy
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    needs:
      - test
      - build-image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
