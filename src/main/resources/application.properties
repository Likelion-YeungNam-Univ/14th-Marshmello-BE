spring.application.name=MarshmelloWas

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/marshmello}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:marshmello}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# OAuth2 / OIDC
spring.security.oauth2.client.registration.oidc.provider=oidc
spring.security.oauth2.client.registration.oidc.client-id=${OIDC_CLIENT_ID:change-me}
spring.security.oauth2.client.registration.oidc.client-secret=${OIDC_CLIENT_SECRET:change-me}
spring.security.oauth2.client.registration.oidc.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.oidc.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.oidc.scope=${OIDC_SCOPES:openid,email}
spring.security.oauth2.client.provider.oidc.issuer-uri=${OIDC_ISSUER_URI:https://accounts.google.com}

# Session

server.forward-headers-strategy=framework
server.servlet.session.timeout=15m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

# Authorization

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
app.oidc.google-offline-access=${OIDC_GOOGLE_OFFLINE_ACCESS:false}
app.authorization.allowed-emails=${APP_ALLOWED_EMAILS:}
app.authorization.allowed-email-domains=${APP_ALLOWED_EMAIL_DOMAINS:}
app.authorization.allowed-subjects=${APP_ALLOWED_SUBJECTS:}
app.authorization.require-verified-email=${APP_REQUIRE_VERIFIED_EMAIL:true}

# health endpoint

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# HTTP request limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Image storage
app.storage.s3.bucket=${AWS_S3_BUCKET:}
app.storage.s3.region=${AWS_REGION:ap-northeast-2}
app.storage.s3.presigned-url-ttl=${AWS_S3_PRESIGNED_URL_TTL:10m}

# AI
app.analysis.onnx.enabled=${ONNX_ENABLED:true}
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5.6-luna}

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.paths-to-match=/api/**
app.login-success-url=${APP_LOGIN_SUCCESS_URL:/}
