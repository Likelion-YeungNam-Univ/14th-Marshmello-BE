spring.application.name=MarshmelloWas

spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V1__init_erd.sql

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# OAuth2 test client

spring.security.oauth2.client.registration.oidc.provider=test-provider
spring.security.oauth2.client.registration.oidc.client-id=test-client
spring.security.oauth2.client.registration.oidc.client-secret=test-secret
spring.security.oauth2.client.registration.oidc.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.oidc.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.oidc.scope=openid,email

spring.security.oauth2.client.provider.test-provider.authorization-uri=https://idp.example.test/authorize
spring.security.oauth2.client.provider.test-provider.token-uri=https://idp.example.test/token
spring.security.oauth2.client.provider.test-provider.jwk-set-uri=https://idp.example.test/jwks
spring.security.oauth2.client.provider.test-provider.user-info-uri=https://idp.example.test/userinfo
spring.security.oauth2.client.provider.test-provider.user-name-attribute=sub

# App security test config

app.oidc.google-offline-access=false
app.authorization.allowed-emails=allowed@example.com
app.authorization.allowed-email-domains=trusted.example
app.authorization.allowed-subjects=subject-allowlisted
app.authorization.require-verified-email=true